name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    env:
      SECRET_KEY: "ci-fake-secret-key-not-for-production"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      # Sobrescrito automaticamente para SQLite pelo settings.py quando 'test' está em sys.argv,
      # mas precisa existir pois é lido incondicionalmente no import do settings.
      DATABASE_URL: "sqlite:///db.sqlite3"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint (flake8)
        run: |
          pip install flake8
          flake8 . --count --max-line-length=120 --exclude=migrations,venv,.venv --show-source --statistics
        continue-on-error: true

      - name: Rodar migrações (check)
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar testes
        run: python manage.py test
